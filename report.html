<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>تقرير حضور ITEX 2026</title>
<style>
  :root { --ink: #092634; --accent: #FF6E42; --ocean: #004E72; --border: #d7dde1; --ok: #16794f; --warn: #b45309; }
  * { box-sizing: border-box; }
  body { margin: 0; direction: rtl; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; color: var(--ink); background: #fff; }
  .toolbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--ink); color: #fff; padding: 10px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .toolbar button {
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 9px 16px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .toolbar a { color: #fff; font-size: 12px; text-decoration: none; opacity: .8; }
  .sheet { max-width: 900px; margin: 0 auto; padding: 24px 20px 60px; }
  .report-header { text-align: center; border-bottom: 2px solid var(--ink); padding-bottom: 14px; margin-bottom: 20px; }
  .report-header h1 { margin: 0 0 4px; font-size: 20px; }
  .report-header .sub { color: var(--accent); font-weight: 700; font-size: 13px; margin: 2px 0; }
  .report-header .meta { color: #667; font-size: 11.5px; margin-top: 8px; }
  h2.section { font-size: 15px; border-right: 4px solid var(--accent); padding-right: 8px; margin: 26px 0 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-bottom: 6px; }
  th, td { border: 1px solid var(--border); padding: 6px 8px; text-align: right; }
  th { background: #f3f5f6; font-size: 11px; }
  tr.category-row td { background: #eef0f2; font-weight: 700; font-size: 12px; }
  .badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 700; }
  .badge.full_day { background: #e6f4ec; color: var(--ok); }
  .badge.morning { background: #e5f0f5; color: var(--ocean); }
  .badge.evening { background: #fdf3e0; color: #a56a0c; }
  .badge.unavailable { background: #eef0f2; color: #778; }
  .badge.muted { color: #ccd; }
  .day-block { border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; margin-bottom: 10px; break-inside: avoid; }
  .day-block h3 { margin: 0 0 6px; font-size: 13.5px; }
  .shift-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .shift-box { border: 1px solid var(--border); border-radius: 5px; padding: 6px 8px; font-size: 11px; }
  .shift-box .label { font-weight: 700; display: flex; justify-content: space-between; }
  .shift-box .warn { color: var(--warn); font-weight: 700; }
  .shift-box .ok { color: var(--ok); font-weight: 700; }
  .shift-box ul { margin: 4px 0 0; padding-inline-start: 14px; }
  .footer-note { margin-top: 24px; font-size: 10.5px; color: #99a; text-align: center; }

  @media print {
    .toolbar { display: none; }
    .sheet { padding: 0; max-width: none; }
    .day-block, tr { break-inside: avoid; }
    h2.section { break-after: avoid; }
    @page { size: A4; margin: 14mm; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <a href="admin.html">→ رجوع للوحة الإدارة</a>
  <button id="printBtn">طباعة / حفظ PDF</button>
</div>
<div class="sheet" id="sheet">
  <p style="text-align:center;padding:60px 0;color:#889;">جارٍ تحميل التقرير...</p>
</div>
<script src="github-config.js?v=10"></script>
<script src="github-store.js?v=10"></script>
<script src="report-app.js?v=10"></script>
</body>
</html>
