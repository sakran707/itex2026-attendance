databases:
  - name: itex2026-attendance-db
    plan: free
    databaseName: itex_attendance
    user: itex_admin

services:
  - type: web
    name: itex2026-attendance
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: itex2026-attendance-db
          property: connectionString
